name: Basic-Go-Testing

on:
  workflow_call:
    inputs:
      GO_VERSION:
        required: true
        type: string
      GO111MODULE:
        required: false
        type: string
      CGO_ENABLED:
        required: false
        type: number
        default: 1
      BUILD_PATH:
        required: false
        type: string
        default: "./..."
      UNIT_TESTS_PATH:
        required: false
        type: string
        default: "./..."
      TEST_TIMEOUT_MINUTES:
        description: Per-package Go test timeout in minutes; must be a positive integer
        required: false
        type: number
        default: 10
      TEST_PARALLELISM:
        description: Maximum parallel Go tests per package; 0 keeps the Go default
        required: false
        type: number
        default: 0
      TEST_PACKAGE_PARALLELISM:
        description: Maximum concurrent Go test/build packages; 0 keeps the Go default
        required: false
        type: number
        default: 0
      FAILEDTHRESHOLD:
        required: false
        type: number
        default: 50
      # TEST_MULTI_ENVIRONMENTS:
      #   required: false
      #   type: boolean
      #   default: true

    secrets:
      SNYK_TOKEN:
        required: false
      GITGUARDIAN_API_KEY:
        required: false

jobs:
  Check-secret:
    name: check if secrets are set
    runs-on: ubuntu-latest
    outputs:
      run-gitgardian: ${{ steps.check-secret-set.outputs.is-gitgardian-set }}
      run-snyk: ${{ steps.check-secret-set.outputs.is-snyk-set }}
    steps:
      - name: Check whether unity activation requests should be done
        id: check-secret-set
        env:
            GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
            echo "is-gitgardian-set=${{ env.GITGUARDIAN_API_KEY != '' }}" >> $GITHUB_OUTPUT
            echo "is-snyk-set=${{ env.SNYK_TOKEN != '' }}" >> $GITHUB_OUTPUT

  # Setup-Environment:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     matrix: ${{ steps.set-matrix.outputs.matrix }}
  #   steps:
  #     - id: set-matrix
  #       env:
  #         TEST_MULTI_ENVIRONMENTS: ${{ inputs.TEST_MULTI_ENVIRONMENTS }}
  #       run: |
  #         if [ ${{ env.TEST_MULTI_ENVIRONMENTS }} ]; then
  #           echo "matrix=[\"ubuntu-20.04\", \"macos-latest\", \"windows-latest\"]" >> $GITHUB_OUTPUT
  #         else
  #           echo "matrix=[\"ubuntu-20.04\"]" >> $GITHUB_OUTPUT
  #         fi

  Environment-Test:
    name: Create cross-platform build
    # needs: [ Setup-Environment ]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
    # strategy:
    #   matrix:
    #     os: ${{ fromJSON(needs.Setup-Environment.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        name: Setup Go
        with:
          go-version: '${{ inputs.GO_VERSION }}'

      - &go_tests
        name: Test Go packages
        id: unit-test
        shell: bash
        env:
          UNIT_TESTS_PATH: ${{ inputs.UNIT_TESTS_PATH }}
          TEST_TIMEOUT_MINUTES: ${{ inputs.TEST_TIMEOUT_MINUTES }}
          TEST_PARALLELISM: ${{ inputs.TEST_PARALLELISM || 0 }}
          TEST_PACKAGE_PARALLELISM: ${{ inputs.TEST_PACKAGE_PARALLELISM || 0 }}
        run: |
          set -euo pipefail
          results_dir=$(mktemp -d "$RUNNER_TEMP/go-tests-${GITHUB_JOB}.XXXXXX")
          printf 'results_dir=%s\nartifact_name=%s\n' "$results_dir" "${results_dir##*/}" >> "$GITHUB_OUTPUT"

          if [[ ! $TEST_TIMEOUT_MINUTES =~ ^[1-9][0-9]*$ ]]; then
            printf 'TEST_TIMEOUT_MINUTES must be a positive integer\n' | tee "$results_dir/setup.stderr" >&2
            exit 1
          fi
          args=(-json -count=1 -timeout "${TEST_TIMEOUT_MINUTES}m")
          for setting in TEST_PARALLELISM TEST_PACKAGE_PARALLELISM; do
            value=${!setting}
            if [[ ! $value =~ ^(0|[1-9][0-9]*)$ ]]; then
              printf '%s must be a non-negative integer\n' "$setting" | tee "$results_dir/setup.stderr" >&2
              exit 1
            fi
          done
          if [[ $TEST_PARALLELISM != 0 ]]; then
            args+=(-parallel "$TEST_PARALLELISM")
          fi
          if [[ $TEST_PACKAGE_PARALLELISM != 0 ]]; then
            args+=(-p "$TEST_PACKAGE_PARALLELISM")
          fi
          if [[ ${TEST_COVERAGE:-false} == true ]]; then
            args+=(-covermode=count -coverprofile=coverage.out)
          else
            args+=(-race)
          fi

          read -r -a patterns <<< "${UNIT_TESTS_PATH//$'\n'/ }"
          go list "${patterns[@]}" > "$results_dir/packages.txt" 2> "$results_dir/list.stderr"
          mapfile -t packages < <(grep -v /e2e "$results_dir/packages.txt")
          if (( ${#packages[@]} == 0 )); then
            printf 'No unit-test packages selected\n' | tee "$results_dir/setup.stderr" >&2
            exit 1
          fi
          # pipefail retains the test exit status even when tee succeeds.
          go test "${args[@]}" "${packages[@]}" 2> "$results_dir/test.stderr" | tee "$results_dir/tests.jsonl"

      - &go_test_summary
        name: Summarize Go test results
        if: ${{ always() && steps.unit-test.outputs.results_dir != '' }}
        shell: bash
        env:
          TEST_RESULTS_DIR: ${{ steps.unit-test.outputs.results_dir }}
          TEST_OUTCOME: ${{ steps.unit-test.outcome }}
        run: |
          python3 - <<'PYTHON'
          import collections
          import html
          import json
          import os
          from pathlib import Path

          results = Path(os.environ["TEST_RESULTS_DIR"])
          failed = set()
          output = collections.defaultdict(lambda: collections.deque(maxlen=40))
          malformed = 0
          with (results / "tests.log").open("w") as readable:
              json_log = results / "tests.jsonl"
              if json_log.exists():
                  with json_log.open(errors="replace") as events:
                      for line in events:
                          try:
                              event = json.loads(line)
                          except json.JSONDecodeError:
                              malformed += 1
                              readable.write(line)
                              continue
                          # Go interleaves BuildEvents (ImportPath)
                          # with TestEvents (Package) in the JSON stream.
                          package = event.get("Package") or event.get("ImportPath", "unknown package")
                          key = (package, event.get("Test", ""))
                          if event.get("Action") in ("fail", "build-fail"):
                              failed.add(key)
                          text = event.get("Output", "")
                          readable.write(text)
                          output[key].extend(text.splitlines())

          status = os.environ["TEST_OUTCOME"]
          parts = [f"## Go tests: {html.escape(status)}\n",
                   "Full JSON, readable output, and stderr are attached as a job artifact.\n"]
          if failed:
              parts.append("### Failed tests and packages\n")
              for package, test in sorted(failed):
                  label = package + (" / " + test if test else " (package)")
                  parts.append(f"- {html.escape(label)}\n")
              # Named failures already include package context. Show package-level
              # output when a build, panic, or TestMain failure has no named test.
              named_packages = {package for package, test in failed if test}
              for key in sorted(failed):
                  package, test = key
                  if not test and package in named_packages:
                      continue
                  label = package + (" / " + test if test else " (package)")
                  excerpt = "\n".join(output[key])[-6000:]
                  parts.append(f"\n<details><summary>{html.escape(label)}</summary>\n\n"
                               f"<pre>{html.escape(excerpt)}</pre>\n</details>\n")
          elif status != "success":
              parts.append("No named test failure was recorded. Check setup/build stderr and the artifact.\n")
          if malformed:
              parts.append(f"\n{malformed} non-JSON or incomplete lines retained in tests.log.\n")
          for name in ("setup.stderr", "list.stderr", "test.stderr"):
              path = results / name
              if path.exists() and path.stat().st_size:
                  with path.open(errors="replace") as stream:
                      tail = "".join(collections.deque(stream, maxlen=40))[-6000:]
                  parts.append(f"\n### {name}\n<pre>{html.escape(tail)}</pre>\n")
          # Leave ample room below GitHub's 1 MiB per-step summary limit.
          summary = "".join(parts)
          if len(summary) > 60000:
              summary = summary[:60000] + "\n\nSummary truncated; consult the complete artifact.\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          PYTHON

      - &go_test_artifact
        name: Upload Go test results
        if: ${{ always() && steps.unit-test.outputs.results_dir != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.unit-test.outputs.artifact_name }}
          path: ${{ steps.unit-test.outputs.results_dir }}
          retention-days: 7
          if-no-files-found: error
      - name: Initialize CodeQL
        continue-on-error: true
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: go

      - name: Autobuild
        continue-on-error: true
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2

      - name: Perform CodeQL Analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2

      # - name: Test go build
      #   run: go build -v ${{ inputs.BUILD_PATH }}

  Basic-Test:
    env:
      TEST_COVERAGE: true
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      CGO_ENABLED: ${{ inputs.CGO_ENABLED }}
    runs-on: ubuntu-latest
    needs: [Check-secret, Environment-Test]
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      name: Setup Go
      with:
        go-version: '${{ inputs.GO_VERSION }}'

    - name: Scanning - Forbidden Licenses (go-licenses)
      id: licenses-scan
      continue-on-error: true
      run: |
        echo "## Installing go-licenses tool"
        go install github.com/google/go-licenses@latest
        echo "## Scanning for forbiden licenses ##"
        go-licenses check ./...

    - name: Scanning - Credentials (GitGuardian)
      if: needs.check-secret.outputs.run-gitgardian == 'true'
      continue-on-error: true
      id: credentials-scan
      uses: GitGuardian/ggshield/actions/secret@76a36a82c2cce0a941bcd34b11654aeab7e471a1 # main
      env:
        GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
        GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
        GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

    - name: Scanning - Vulnerabilities (Snyk)
      if: needs.check-secret.outputs.run-snyk == 'true'
      id: vulnerabilities-scan
      continue-on-error: true
      uses: snyk/actions/golang@b075801f26076be9bb50521154cafab73f44da0c # master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Test go linting
      continue-on-error: true  # TODO: Should be removed
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      id: linting
      with:
        version: latest
        args: --timeout 10m
        only-new-issues: true

    - *go_tests
    - *go_test_summary
    - *go_test_artifact

    - name: Comment results to PR
      uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
      continue-on-error: true # This step typically fails when opening PRs from forks
      with:
        issue-number:  ${{ github.event.pull_request.number }}
        body: |
          Summary:
          - License scan: ${{ steps.licenses-scan.outcome }}
          - Credentials scan: ${{ steps.credentials-scan.outcome }}
          - Vulnerabilities scan: ${{ steps.vulnerabilities-scan.outcome }}
          - Unit test: ${{ steps.unit-test.outcome }}
          - Go linting: ${{ steps.linting.outcome }}
        reactions: 'eyes'
