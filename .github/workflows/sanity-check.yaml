name:
    system-sanity-check

    # Controls when the workflow will run
on:
    # Triggers the workflow every 5 minutes
    # schedule:
    #   - cron: "*/30 * * * *"

    workflow_call:
        inputs:
            GH_RUNNER:
                type: string
                default: "ubuntu-latest"
            SYSTEM_TESTS_BRANCH:
                type: string
                default: "master"
            BINARY_TESTS:
                type: string
                default: '[ "scan_nsa",
                    "scan_mitre",
                    "scan_with_exceptions",
                    "scan_repository",
                    "scan_local_file",
                    "scan_local_glob_files",
                    "scan_local_list_of_files",
                    "scan_and_submit_to_backend",
                    "scan_git_repository_and_submit_to_backend",
                    "scan_with_exception_to_backend",
                    "scan_customer_configuration",
                    "host_scanner"
                    ]'
jobs:
    wf-preparation:
        name: secret-validator
        runs-on: ubuntu-latest
        outputs:
            TEST_NAMES: ${{ steps.export_tests_to_env.outputs.TEST_NAMES }}
            is-secret-set: ${{ steps.check-secret-set.outputs.is-secret-set }}
        steps:
            - name: check if the necessary secrets are set in github secrets
              id: check-secret-set
              env:
                  CUSTOMER: ${{ secrets.CUSTOMER }}
                  USERNAME: ${{ secrets.USERNAME }}
                  PASSWORD: ${{ secrets.PASSWORD }}
                  CLIENT_ID: ${{ secrets.CLIENT_ID_PROD }}
                  SECRET_KEY: ${{ secrets.SECRET_KEY_PROD }}
                  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
                  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
              run: "echo \"is-secret-set=${{ env.CUSTOMER != '' && \n                        env.USERNAME != '' &&\n                        env.PASSWORD != '' &&\n                        env.CLIENT_ID != '' &&\n                        env.SECRET_KEY != '' &&\n                        env.REGISTRY_USERNAME != '' &&\n                        env.REGISTRY_PASSWORD != ''\n                      }}\" >> $GITHUB_OUTPUT\n"

            - id: export_tests_to_env
              name: set test name
              run: |
                  echo "TEST_NAMES=$input" >> $GITHUB_OUTPUT
              env:
                  input: ${{ inputs.BINARY_TESTS }}

    run-tests:
        strategy:
            fail-fast: false
            matrix:
                TEST: ${{ fromJson(needs.wf-preparation.outputs.TEST_NAMES) }}
        needs: wf-preparation
        runs-on: ${{ inputs.GH_RUNNER }}
        steps:
            - name: Checkout systests repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  repository: armosec/system-tests
                  path: .
                  ref: ${{ inputs.SYSTEM_TESTS_BRANCH }}

            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.9"
                  cache: "pip"

            - name: create env
              run: ./create_env.sh

            - name: Generate uuid
              id: uuid
              run: |
                  echo "RANDOM_UUID=systets-$(uuidgen)" >> $GITHUB_OUTPUT
            - name: Create k8s Kind Cluster
              id: kind-cluster-install
              uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
              with:
                  cluster_name: ${{ steps.uuid.outputs.RANDOM_UUID }}
                  # kubectl_version: v1.23.12
                  # verbosity:

            - name: run-tests
              env:
                  CUSTOMER: ${{ secrets.CUSTOMER }}
                  USERNAME: ${{ secrets.USERNAME }}
                  PASSWORD: ${{ secrets.PASSWORD }}
                  CLIENT_ID: ${{ secrets.CLIENT_ID_PROD }}
                  SECRET_KEY: ${{ secrets.SECRET_KEY_PROD }}
                  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
                  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
              run: |
                  echo "Test history:"
                  echo " ${{ matrix.TEST }} " >/tmp/testhistory
                  cat /tmp/testhistory
                  source systests_python_env/bin/activate
                  python3 systest-cli.py             \
                    -t ${{ matrix.TEST }}            \
                    -b production                    \
                    -c CyberArmorTests               \
                    --logger DEBUG                   \
                    --kwargs helm_branch=release     \
                  deactivate

            - name: Test Report
              uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
              if: always() # always run even if the previous step fails
              with:
                  report_paths: "**/results_xml_format/**.xml"
