name: pr-checks

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - '**.md' ### Ignore running when .md files change

jobs:
  validate-go-test-reporting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
      - name: Exercise test failure reporting
        run: python3 -m unittest discover -s tests -v

  validate-go-basic-tests-file:
    permissions:
      pull-requests: write
    uses: ./.github/workflows/go-basic-tests.yaml
    with:
      GO_VERSION: 1.19
      BUILD_PATH: "./testdata/."
      UNIT_TESTS_PATH: "./testdata/."
      # TEST_MULTI_ENVIRONMENTS: true
    secrets: inherit

  # Validate release files and release pkg. 
  validate-package-releaser-file:
    needs: validate-go-basic-tests-file
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/package-release.yaml
    with:
      RELEASE: "v1.0.${{ github.run_number }}"
      GO_VERSION: 1.19
      IS_DRAFT: false
      BUILD_PATH: "./testdata/."
      UNIT_TESTS_PATH: "./testdata/."
    secrets: inherit

  # TODO: Remove created tag
